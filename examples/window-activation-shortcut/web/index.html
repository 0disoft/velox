<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Velox Activation Shortcut</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header><h1>Activation Note</h1></header>
    <main>
      <label for="note">Note</label>
      <textarea id="note" maxlength="2048" spellcheck="false">Activation shortcut test.</textarea>
    </main>
    <footer>
      <span id="status" role="status" aria-live="polite">Ready.</span>
      <output id="note-count" for="note">25 / 2048</output>
    </footer>
  </body>
</html>
