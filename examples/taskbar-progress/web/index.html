<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Velox Taskbar Progress</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header><h1>Taskbar Progress</h1></header>
    <main>
      <fieldset id="states">
        <legend>State</legend>
        <label><input type="radio" name="state" value="none" checked>None</label>
        <label><input type="radio" name="state" value="indeterminate">Indeterminate</label>
        <label><input type="radio" name="state" value="normal">Normal</label>
        <label><input type="radio" name="state" value="error">Error</label>
        <label><input type="radio" name="state" value="paused">Paused</label>
      </fieldset>
      <div class="value-heading"><label for="value">Progress</label><output id="percentage" for="value">50%</output></div>
      <div class="value-controls">
        <input id="value" type="range" min="0" max="100" step="1" value="50" disabled>
        <button id="clear-progress" type="button" title="Clear progress" aria-label="Clear progress"><img src="icons/x.svg" width="18" height="18" alt=""></button>
      </div>
      <div class="indicator" id="indicator" data-state="none">
        <div id="progress-bar" role="progressbar" aria-label="Operation progress" aria-valuemin="0" aria-valuemax="100" aria-hidden="true"><span id="progress-fill"></span></div>
        <span id="progress-label">None</span>
      </div>
    </main>
    <footer><span id="status" role="status" aria-live="polite">Ready.</span></footer>
  </body>
</html>
