<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title>{{APP_NAME}}</title>
    <link rel="stylesheet" href="style.css">
    <script src="drafts.js" defer></script>
    <script src="find.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <strong class="app-name">{{APP_NAME}}</strong>
      <div class="document-identity">
        <span id="document-name">Untitled.txt</span>
        <span id="save-state">No save target</span>
      </div>
    </header>
    <nav aria-label="Document actions">
      <button id="new-document" type="button" aria-label="New" title="New" aria-keyshortcuts="Control+N"><img src="file-plus.svg" width="20" height="20" alt=""></button>
      <button id="open-document" type="button" aria-label="Open" title="Open" aria-keyshortcuts="Control+O"><img src="folder-open.svg" width="20" height="20" alt=""></button>
      <button id="save-document" type="button" aria-label="Save" title="Save" aria-keyshortcuts="Control+S"><img src="save.svg" width="20" height="20" alt=""></button>
      <button id="save-as-document" type="button" aria-label="Save as" title="Save as" aria-keyshortcuts="Control+Shift+S"><img src="save-all.svg" width="20" height="20" alt=""></button>
      <button id="find-document" class="icon-button" type="button" aria-label="Find in document" title="Find in document" aria-keyshortcuts="Control+F" aria-controls="find-bar" aria-expanded="false"><img src="search.svg" width="20" height="20" alt=""></button>
    </nav>
    <main>
      <div id="find-bar" role="search" aria-label="Find in document" hidden>
        <input id="find-input" type="text" inputmode="search" aria-label="Find text" placeholder="Find" autocomplete="off" spellcheck="false" aria-describedby="find-count">
        <div class="find-actions">
          <button id="find-previous" class="icon-button" type="button" aria-label="Previous match" title="Previous match"><img src="chevron-up.svg" width="20" height="20" alt=""></button>
          <button id="find-next" class="icon-button" type="button" aria-label="Next match" title="Next match"><img src="chevron-down.svg" width="20" height="20" alt=""></button>
          <button id="find-close" class="icon-button" type="button" aria-label="Close find" title="Close find"><img src="x.svg" width="20" height="20" alt=""></button>
        </div>
        <label class="find-case"><input id="find-case" type="checkbox">Match case</label>
        <span id="find-count" role="status" aria-live="polite"></span>
      </div>
      <textarea id="editor" aria-label="Text document" spellcheck="true" autocomplete="off"></textarea>
    </main>
    <footer><p id="status" role="status" aria-live="polite">Ready.</p><p id="draft-state" role="status" aria-live="polite">Checking draft...</p></footer>
    <dialog id="recovery-dialog" aria-labelledby="recovery-title">
      <form method="dialog">
        <h2 id="recovery-title">Recover draft?</h2>
        <p id="draft-name"></p>
        <div class="dialog-actions">
          <button type="submit" value="recover" autofocus>Restore</button>
          <button type="submit" value="discard" class="danger">Discard</button>
        </div>
      </form>
    </dialog>
    <dialog id="discard-dialog" aria-labelledby="discard-title">
      <form method="dialog">
        <h2 id="discard-title">Discard unsaved changes?</h2>
        <div class="dialog-actions">
          <button type="submit" value="cancel" autofocus>Keep editing</button>
          <button type="submit" value="discard" class="danger">Discard</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
